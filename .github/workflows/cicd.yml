name: CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build-test:
    name: Docker Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Maven Wrapper executable
        working-directory: apps/api
        run: chmod +x mvnw

      - name: Build Backend Docker Image
        working-directory: apps/api
        run: docker compose build backend

  deploy:
    name: Deploy Foodie Backend
    needs: build-test
    runs-on: ubuntu-latest

    # Deploy only for pushes to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Foodie VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting Foodie deployment"
            echo "======================================"

            cd /root/foodie/backend

            echo "Checking current Git status..."
            git status

            echo "Pulling latest code from main..."
            git pull origin main

            cd /root/foodie/backend/apps/api

            echo "Starting Foodie backend stack..."
            docker compose --profile full up -d --build --no-cache

            echo "Waiting for Foodie backend to become healthy..."

            for i in {1..30}; do
              STATUS=$(docker inspect foodie-backend \
                --format '{{.State.Health.Status}}' 2>/dev/null || echo "starting")

              echo "Health status: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "======================================"
                echo "Foodie backend is healthy!"
                echo "======================================"
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "======================================"
                echo "Foodie backend is unhealthy!"
                echo "======================================"
                docker compose logs backend --tail=100
                exit 1
              fi

              sleep 5

              if [ "$i" -eq 30 ]; then
                echo "======================================"
                echo "Foodie backend did not become healthy in time."
                echo "======================================"
                docker compose ps
                docker compose logs backend --tail=100
                exit 1
              fi
            done

            echo "Checking Docker containers..."
            docker compose ps

            echo "Checking backend logs..."
            docker compose logs backend --tail=50

            echo "======================================"
            echo "Foodie deployment completed successfully"
            echo "======================================"
