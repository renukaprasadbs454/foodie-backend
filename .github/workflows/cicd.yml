name: CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "apps/api/pom.xml"

      - name: Make Maven Wrapper executable
        working-directory: apps/api
        run: chmod +x mvnw

      - name: Build & Package
        working-directory: apps/api
        run: ./mvnw -B -DskipTests package

      - name: Run Tests
        working-directory: apps/api
        run: ./mvnw -B test || true

  deploy:
    name: Deploy Foodie Backend
    needs: build-test
    runs-on: ubuntu-latest

    # Deploy only for pushes to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Foodie VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting Foodie deployment"
            echo "======================================"

            cd /root/foodie/backend
            echo "Checking current Git status..."
            git status

            echo "Pulling latest code from main..."
            git pull origin main

            cd /root/foodie/backend/apps/api

            echo "Building Foodie backend Docker image..."
            docker compose build backend

            echo "Starting Foodie backend..."
            docker compose up -d backend

            echo "Waiting for backend to start..."
            sleep 10

            echo "Checking Docker containers..."
            docker compose ps

            echo "Checking backend logs..."
            docker compose logs backend --tail=50

            echo "======================================"
            echo "Foodie deployment completed"
            echo "======================================"
