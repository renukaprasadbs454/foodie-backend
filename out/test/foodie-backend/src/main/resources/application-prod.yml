spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:foodie}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.foodie: INFO
  pattern:
    console: "{\"timestamp\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}\",\"level\":\"%level\",\"thread\":\"%thread\",\"logger\":\"%logger\",\"requestId\":\"%X{requestId}\",\"correlationId\":\"%X{correlationId}\",\"message\":\"%msg\"}%n"

management:
  endpoint:
    health:
      show-details: never
