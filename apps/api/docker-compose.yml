services:
  postgres:
    image: postgres:15-alpine
    container_name: foodie-postgres
    environment:
      POSTGRES_DB: foodie
      POSTGRES_USER: foodie
      POSTGRES_PASSWORD: foodie
    ports:
      - "5433:5432"
    volumes:
      - foodie_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodie -d foodie"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: foodie-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - foodie_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodie-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: foodie
      DB_USER: foodie
      DB_PASSWORD: foodie
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      FOODIE_LOCAL_STORAGE_ROOT: /tmp/foodie-object-storage
      JWT_SECRET: local-dev-only-change-me-foodie-jwt-secret-key-32b
      RAZORPAY_MODE: stub
      FCM_MODE: stub
      CASHFREE_APP_ID: ${CASHFREE_APP_ID}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY}
      CASHFREE_ENV: ${CASHFREE_ENV}
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: foodie-nginx
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    profiles:
      - full

volumes:
  foodie_pg_data:
  foodie_redis_data:
