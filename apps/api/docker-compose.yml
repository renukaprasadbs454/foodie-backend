services:
  postgres:
    image: postgres:15-alpine
    container_name: foodie-postgres
    environment:
      POSTGRES_DB: foodie
      POSTGRES_USER: foodie
      POSTGRES_PASSWORD: foodie
    ports:
      - "5433:5432"
    volumes:
      - foodie_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodie -d foodie"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: foodie-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - foodie_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodie-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: foodie
      DB_USER: foodie
      DB_PASSWORD: foodie
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      FOODIE_LOCAL_STORAGE_ROOT: /tmp/foodie-object-storage
      JWT_SECRET: local-dev-only-change-me-foodie-jwt-secret-key-32b
      RAZORPAY_MODE: stub
      FCM_MODE: stub
      MAPS_PROVIDER: ${MAPS_PROVIDER:-google}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v18.0}
      WHATSAPP_OTP_TEMPLATE_NAME: ${WHATSAPP_OTP_TEMPLATE_NAME:-foodie_otp_verify}
      WHATSAPP_OTP_TEMPLATE_LANGUAGE: ${WHATSAPP_OTP_TEMPLATE_LANGUAGE:-en}
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: foodie-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    profiles:
      - full

volumes:
  foodie_pg_data:
  foodie_redis_data:
