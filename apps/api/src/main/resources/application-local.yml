server:
  address: 0.0.0.0
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/foodie-db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE;INIT=ALTER TABLE IF EXISTS "restaurant" ADD COLUMN IF NOT EXISTS "is_open" BOOLEAN DEFAULT TRUE\;UPDATE "restaurant" SET "is_open" = TRUE WHERE "is_open" IS NULL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: true
        type:
          preferred_enum_jdbc_type: VARCHAR

foodie:
  razorpay:
    mode: live

logging:
  level:
    com.foodie: DEBUG
    org.springframework.security: INFO

management:
  endpoint:
    health:
      show-details: always

CASHFREE_APP_ID: ${CASHFREE_APP_ID:}
CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:}
CASHFREE_ENV: ${CASHFREE_ENV:SANDBOX}
