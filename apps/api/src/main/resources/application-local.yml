server:
  address: 0.0.0.0
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/foodie-db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        globally_quoted_identifiers: true
        type:
          preferred_enum_jdbc_type: VARCHAR

foodie:
  razorpay:
    mode: test

logging:
  level:
    com.foodie: DEBUG
    org.springframework.security: INFO

management:
  endpoint:
    health:
      show-details: always
