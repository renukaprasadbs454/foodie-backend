spring:
  application:
    name: foodie-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        auto_quote_keyword: true
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  data:
    redis:
      repositories:
        enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

foodie:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-foodie-jwt-secret-key-32b}
    access-token-ttl-seconds: 900
    refresh-token-ttl-customer-seconds: 2592000
    refresh-token-ttl-partner-seconds: 1209600
    refresh-token-ttl-admin-seconds: 604800
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:local-google-client-id.apps.googleusercontent.com}
  storage:
    local-root: ${FOODIE_LOCAL_STORAGE_ROOT:./.local-object-storage}
  restaurant:
    default-commission-pct: ${FOODIE_DEFAULT_COMMISSION_PCT:18.00}
  order:
    default-delivery-fee: ${FOODIE_DEFAULT_DELIVERY_FEE:30.00}
    tax-rate: ${FOODIE_ORDER_TAX_RATE:0.05}
  razorpay:
    mode: ${RAZORPAY_MODE:test}
    key-id: ${RAZORPAY_KEY_ID:rzp_test_TR9mlA2zOImhpF}
    key-secret: ${RAZORPAY_KEY_SECRET:W6q8k3NDFXHcYrsaBjcgsWfN}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:local-razorpay-webhook-secret}
    api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
  payout:
    provider: ${PAYMENT_PROVIDER:CASHFREE}
    mode: ${PAYOUT_MODE:live}
    razorpay:
      account-number: ${RAZORPAYX_ACCOUNT_NUMBER:2323230041387700}
      key-id: ${RAZORPAY_KEY_ID:rzp_test_TR9mlA2zOImhpF}
      key-secret: ${RAZORPAY_KEY_SECRET:W6q8k3NDFXHcYrsaBjcgsWfN}
      webhook-secret: ${RAZORPAY_PAYOUT_WEBHOOK_SECRET:local-razorpay-payout-webhook-secret}
      api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
    cashfree:
      client-id: ${CASHFREE_CLIENT_ID:local_cashfree_client_id}
      client-secret: ${CASHFREE_CLIENT_SECRET:local_cashfree_client_secret}
      webhook-secret: ${CASHFREE_WEBHOOK_SECRET:local-cashfree-webhook-secret}
      api-base-url: ${CASHFREE_API_BASE_URL:https://payout-api.cashfree.com/payout/v1.2}
  delivery:
    offer-radius-km: ${FOODIE_DELIVERY_OFFER_RADIUS_KM:5.0}
  fcm:
    mode: ${FCM_MODE:stub}
    project-id: ${FCM_PROJECT_ID:}
    credentials-path: ${FCM_CREDENTIALS_PATH:}
    max-attempts: ${FCM_MAX_ATTEMPTS:3}
  whatsapp:
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:1221588944380691}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:foodie_whatsapp_verify_token_2026}

logging:
  level:
    root: INFO
    com.foodie: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n"
